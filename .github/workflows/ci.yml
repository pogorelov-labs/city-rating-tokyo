name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=moderate

  schema:
    # Codegen drift gate + cross-language parity test.
    # Ensures the generated constants (ts/ + python/ + vendored app copy)
    # match constants.json, and that TS and Python values agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema codegen deps
        working-directory: ./packages/schema
        run: npm ci
      - name: Codegen drift gate
        working-directory: ./packages/schema
        run: |
          npm run gen
          git diff --exit-code || (echo "ERROR: generated files are out of sync with constants.json. Run 'npm run gen' and commit the result." && exit 1)
      - name: Cross-language parity test
        run: |
          pip install pytest pydantic --quiet
          pytest scripts/test_schema_parity.py scripts/test_compute_ratings.py -v

  mcp:
    # Lint + install check for the FastMCP Python service in mcp/.
    # Does NOT build the Docker image: the Dockerfile bakes a 2.2 GB
    # fastembed ONNX model cache (Stage 2) which is far too heavy for CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Ruff
        # PYTHONPATH includes the shared schema package so the lint sees the
        # city_rating_schema imports that mcp/src/city_rating_mcp/scoring.py uses.
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        run: ruff check src/
      - name: MCP import check
        # This confirms the editable MCP install imports cleanly (the schema
        # package resolves, scoring.py loads, etc.). It is NOT a test suite —
        # no MCP unit tests exist yet. The cross-language parity test
        # (scripts/test_schema_parity.py) lives outside this job's working
        # directory and runs only locally. Pytest exits 5 when no tests are
        # collected; treat that (and 0) as success. GitHub's default shell is
        # `bash -e`, which aborts BEFORE the exit-code check can run, so we
        # disable -e for this step.
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        shell: bash
        run: |
          set +e
          pytest
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
          exit 0
      # NOTE: mcp/scripts/smoke-test.py is a deploy-time / manual check —
      # it requires data/station-datamart.json, data/embeddings.npz, and
      # loads the 2.2 GB fastembed model at runtime. Not runnable in CI.
