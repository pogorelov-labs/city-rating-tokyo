name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
      - run: npm audit --audit-level=moderate

  mcp:
    # Lint + install check for the FastMCP Python service in mcp/.
    # Does NOT build the Docker image: the Dockerfile bakes a 2.2 GB
    # fastembed ONNX model cache (Stage 2) which is far too heavy for CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src/
      - name: Pytest
        # No unit tests exist yet — this step primarily confirms the
        # editable install imports cleanly. Pytest exits 5 when no tests
        # are collected; treat that (and 0) as success.
        run: |
          pytest
          code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 5 ]; then exit "$code"; fi
      # NOTE: mcp/scripts/smoke-test.py is a deploy-time / manual check —
      # it requires data/station-datamart.json, data/embeddings.npz, and
      # loads the 2.2 GB fastembed model at runtime. Not runnable in CI.
