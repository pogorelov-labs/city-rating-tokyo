name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Errors fail the job; warnings don't. Lint crashed from 2026-08 until
      # CRTKY-133 and nobody noticed, because CI never ran it.
      - run: npm run lint
      # CRTKY-157: the 303 unit tests never ran in CI before this — a red
      # suite could not block a PR.
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          BANGKOK_RENDERER_LAB: "0"
          BANGKOK_MAP_RENDERER: maplibre
      - run: npm audit --audit-level=moderate
      # Production uses this Dockerfile with app/ as its build context. The
      # container must type-check and build without files from the checkout's
      # parent directories, as it does during deployment.
      - name: Build production Docker image
        run: docker build --progress plain --file Dockerfile --tag city-rating-app-ci .
      - name: Check production image routes
        run: |
          map_container=$(docker run --detach --rm --publish 127.0.0.1:3100:3000 city-rating-app-ci)
          trap 'docker rm --force "$map_container" >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --max-time 5 http://127.0.0.1:3100/ru/bangkok > /dev/null; then break; fi
            sleep 1
          done
          map_worker_version=$(node -p "require('./node_modules/maplibre-gl/package.json').version")
          for map_route in / /bangkok /ja/bangkok /ru/bangkok /station/shibuya /bangkok/station/asok "/map-assets/maplibre-gl-worker-$map_worker_version.mjs" "/map-assets/maplibre-gl-license-$map_worker_version.txt"; do
            map_http_status=$(curl --silent --show-error --max-time 20 --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:3100$map_route")
            test "$map_http_status" = 200 || { echo "$map_route returned $map_http_status"; exit 1; }
          done

  schema:
    # Codegen drift gate + cross-language parity test.
    # Ensures the generated constants (ts/ + python/ + vendored app copy)
    # match constants.json, and that TS and Python values agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema codegen deps
        working-directory: ./packages/schema
        run: npm ci
      - name: Codegen drift gate
        working-directory: ./packages/schema
        run: |
          npm run gen
          git diff --exit-code || (echo "ERROR: generated files are out of sync with constants.json. Run 'npm run gen' and commit the result." && exit 1)
      - name: Pipeline tests (parity, compute, export, slugs, ingests)
        # Runs every scripts/test_*.py (pytest.ini testpaths). The ingest tests
        # also check the committed data/ files they produce.
        run: |
          pip install pytest pydantic requests "numpy>=2" "shapely>=2.1" "rasterio>=1.4,<2" "duckdb>=1.1" --quiet
          pip install -r scripts/requirements-ingest.txt --quiet
          pytest -v
      - name: Validate livecam health-check input (offline)
        run: python scripts/check-livecams.py --offline --threshold 0

  mcp:
    # Lint + install check for the FastMCP Python service in mcp/.
    # Does NOT build the Docker image: the Dockerfile bakes a 2.2 GB
    # fastembed ONNX model cache (Stage 2) which is far too heavy for CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Ruff
        # PYTHONPATH includes the shared schema package so the lint sees the
        # city_rating_schema imports that mcp/src/city_rating_mcp/scoring.py uses.
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        run: ruff check src/
      - name: MCP unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        run: pytest tests/ -q
      # NOTE: mcp/scripts/smoke-test.py is a deploy-time / manual check —
      # it requires data/station-datamart.json, data/embeddings.npz, and
      # loads the 2.2 GB fastembed model at runtime. Not runnable in CI.

  bangkok:
    # Bangkok district pipeline: pure-Python rating math + integrity of the
    # committed app data plus offline WorldPop raster fixtures. No live downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bangkok pipeline tests
        run: |
          pip install pytest requests "numpy>=2" "shapely>=2.1" "rasterio>=1.4,<2" "duckdb>=1.1" --quiet
          pytest scripts/bangkok -v

  e2e:
    # Run without retries so a flaky interaction fails the check visibly.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npx playwright install --with-deps chromium
      - name: Build the release app
        working-directory: ./app
        env:
          BANGKOK_RENDERER_LAB: "0"
          BANGKOK_MAP_RENDERER: maplibre
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build && npm run prepare:standalone
      - name: Test the standalone release server
        env:
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_PRODUCTION: "1"
          BANGKOK_RENDERER_LAB: "0"
        run: |
          HOSTNAME=127.0.0.1 PORT=3000 node app/.next/standalone/server.js > "$RUNNER_TEMP/city-rating-server.log" 2>&1 &
          map_server_pid=$!
          trap 'kill "$map_server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 60); do
            if curl --fail --silent --location --max-redirs 2 http://127.0.0.1:3000/bangkok > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent --show-error --location --max-redirs 2 http://127.0.0.1:3000/bangkok > /dev/null
          npm run test:e2e -- --workers=1 --retries=0 --reporter=line
      - name: Verify the opt-in renderer lab
        env:
          E2E_PORT: "3001"
        run: npm run test:e2e:lab -- --retries=0 --reporter=line
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-evidence
          path: |
            test-results/
            ${{ runner.temp }}/city-rating-server.log
          retention-days: 7
          if-no-files-found: ignore
