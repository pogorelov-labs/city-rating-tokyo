name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Errors fail the job; warnings don't. Lint crashed from 2026-08 until
      # CRTKY-133 and nobody noticed, because CI never ran it.
      - run: npm run lint
      # CRTKY-157: the 303 unit tests never ran in CI before this — a red
      # suite could not block a PR.
      - run: npm run test
      - run: npx tsc --noEmit
      - run: npm run build
      # Runtime deps only. The dev chain (eslint-config-next + next-sitemap ->
      # micromatch -> braces, GHSA-vfj7-8cjw-p6xm) has no released fix: braces
      # 3.0.4 does not exist yet — advisory unfixed ecosystem-wide, build-time
      # only, never shipped. Re-add the full audit once braces ships the fix.
      - run: npm audit --omit=dev --audit-level=moderate

  schema:
    # Codegen drift gate + cross-language parity test.
    # Ensures the generated constants (ts/ + python/ + vendored app copy)
    # match constants.json, and that TS and Python values agree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install schema codegen deps
        working-directory: ./packages/schema
        run: npm ci
      - name: Codegen drift gate
        working-directory: ./packages/schema
        run: |
          npm run gen
          git diff --exit-code || (echo "ERROR: generated files are out of sync with constants.json. Run 'npm run gen' and commit the result." && exit 1)
      - name: Pipeline tests (parity, compute, export, slugs, ingests)
        # Runs every scripts/test_*.py (pytest.ini testpaths). The ingest tests
        # also check the committed data/ files they produce.
        run: |
          pip install pytest pydantic requests "numpy>=2" "shapely>=2.1" "rasterio>=1.4,<2" --quiet
          pip install -r scripts/requirements-ingest.txt --quiet
          pytest -v

  mcp:
    # Lint + install check for the FastMCP Python service in mcp/.
    # Does NOT build the Docker image: the Dockerfile bakes a 2.2 GB
    # fastembed ONNX model cache (Stage 2) which is far too heavy for CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: mcp/pyproject.toml
      - name: Install package + dev deps
        run: pip install -e ".[dev]"
      - name: Ruff
        # PYTHONPATH includes the shared schema package so the lint sees the
        # city_rating_schema imports that mcp/src/city_rating_mcp/scoring.py uses.
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        run: ruff check src/
      - name: MCP unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}/packages/schema/python
        run: pytest tests/ -q
      # NOTE: mcp/scripts/smoke-test.py is a deploy-time / manual check —
      # it requires data/station-datamart.json, data/embeddings.npz, and
      # loads the 2.2 GB fastembed model at runtime. Not runnable in CI.

  bangkok:
    # Bangkok district pipeline: pure-Python rating math + integrity of the
    # committed app data plus offline WorldPop raster fixtures. No live downloads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bangkok pipeline tests
        run: |
          pip install pytest requests "numpy>=2" "shapely>=2.1" "rasterio>=1.4,<2" --quiet
          pytest scripts/bangkok -v

  e2e:
    # Advisory while browser and tile infrastructure stability is established.
    continue-on-error: true
    timeout-minutes: 12
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - run: npm ci
      - run: npm ci --prefix app
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/map-interactions.spec.ts
