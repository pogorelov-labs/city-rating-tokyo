    <script>
        var map
        var type_data = undefined;

        const layers = [
            'ข้อมูล iTIC ปี 2022-2020',
            'ข้อมูล DGA ปี 2020-2018',
        ];
        const colors = [
            '#B42222',
            '#004AAD',
        ];

        const legend = document.getElementById('legend');

        function init() {

            map = new longdo.Map({
                layer: [longdo.Layers.GRAY],
                zoom: 12,
                placeholder: document.getElementById('map'),
                center: [100.563320, 13.758296]
            });
            // map.Layers.setBase(longdo.Layers.GRAY);

            map.Event.bind("ready", function (location) {

                map.Tags.add('%',
                    {
                        visibleRange: { min: 19, max: 20 }
                    });

                // iTIC Heatmap id "accident-heat"
                map.Layers.add(
                    new longdo.Layer({
                        sources: {
                            accident: {
                                type: "geojson",
                                data: "./heatmap-itic.geojson",
                            },
                        },
                        layers: [
                            {
                                id: "accident-heat",
                                type: "heatmap",
                                source: "accident",
                                minzoom: 8,
                                maxzoom: 17,
                                paint: {
                                    // increase weight as diameter breast height increases
                                    'heatmap-weight': {
                                        // 'property': 'dbh',
                                        'type': 'exponential',
                                        'stops': [
                                            [1, 0],
                                            [62, 1]
                                        ]
                                    },
                                    // increase intensity as zoom level increases
                                    'heatmap-intensity': {
                                        'stops': [
                                            [8, 0.5],
                                            [15, 3]
                                        ]
                                    },
                                    // use sequential color palette to use exponentially as the weight increases
                                    'heatmap-color': [
                                        'interpolate',
                                        ['linear'],
                                        ['heatmap-density'],
                                        0,
                                        "rgba(33,102,172,0)",
                                        0.1,
                                        "rgba(184,229,255,0.5)",
                                        0.3,
                                        "rgb(255,251,148)",
                                        0.5,
                                        "rgb(253,219,199)",
                                        0.7,
                                        "rgb(239,138,98)",
                                        1,
                                        "rgb(178,24,43)"
                                    ],

                                    // increase radius as zoom increases
                                    'heatmap-radius': {
                                        'stops': [
                                            [8, 1],
                                            [15, 20]
                                        ]
                                    },
                                    // decrease opacity to transition into the circle layer
                                    'heatmap-opacity': {
                                        'default': 1,
                                        'stops': [
                                            [8, 0.9],
                                            [16, 0.3]
                                        ]
                                    }
                                }
                            },
                        ],
                    })
                );

                // map.Layers.add(
                //     new longdo.Layer({
                //         sources: {
                //             accident_grids_itic_2022_2020: {
                //                 type: "geojson",
                //                 data: "./data/accident_grids_itic_2022_2020.geojson",
                //                 // data: "./bkk-accident-only.geojson",
                //             },
                //         },
                //         layers: [
                //             {
                //                 'id': 'accident_grids_itic_2022_2020',
                //                 'type': 'circle',
                //                 'source': 'accident_grids_itic_2022_2020',
                //                 'minzoom': 7,
                //                 'maxzoom': 20,
                //                 'paint': {
                //                     'circle-radius': 5,
                //                     'circle-color': '#B42222'
                //                 },
                //                 'filter': ['==', '$type', 'Point']
                //             }
                //         ],
                //     })
                // );

                //iTIC dbscan point id "itic_dbscan"
                map.Layers.add(
                    new longdo.Layer({
                        sources: {
                            itic_dbscan: {
                                type: "geojson",
                                data: "./data/accident_grids_itic_dbscan_2022_2020.geojson",
                                // data: "./bkk-accident-only.geojson",
                            },
                        },
                        layers: [
                            {
                                'id': 'itic_dbscan',
                                'type': 'circle',
                                'source': 'itic_dbscan',
                                'minzoom': 7,
                                'maxzoom': 20,
                                'paint': {
                                    'circle-radius': 5,
                                    'circle-color': '#B42222'
                                },
                                'filter': ['==', '$type', 'Point']
                            }
                        ],
                    })
                );

                // RVP dbscan point id "accident_grids_rvp_dbscan_2022_2020"
                map.Layers.add(
                    new longdo.Layer({
                        sources: {
                            accident_grids_rvp_dbscan_2022_2020: {
                                type: "geojson",
                                data: "./data/accident_grids_rvp_dbscan_2022_2020.geojson",
                                // data: "./bkk-accident-only.geojson",
                            },
                        },
                        layers: [
                            {
                                'id': 'accident_grids_rvp_dbscan_2022_2020',
                                'type': 'circle',
                                'source': 'accident_grids_rvp_dbscan_2022_2020',
                                'minzoom': 7,
                                'maxzoom': 20,
                                'paint': {
                                    'circle-radius': 5,
                                    'circle-color': '#B42222'
                                },
                                'filter': ['==', '$type', 'Point']
                            }
                        ],
                    })
                );

                // RVP Heatmap accident-heat-rvp
                map.Layers.add(
                    new longdo.Layer({
                        sources: {
                            accident_heatmap: {
                                type: "geojson",
                                data: "./heatmap-rvp-2.geojson",
                            },
                        },
                        layers: [
                            {
                                id: "accident-heat-rvp",
                                type: "heatmap",
                                source: "accident_heatmap",
                                minzoom: 8,
                                maxzoom: 17,
                                paint: {
                                    // increase weight as diameter breast height increases
                                    'heatmap-weight': {
                                        // 'property': 'dbh',
                                        'type': 'exponential',
                                        'stops': [
                                            [1, 0],
                                            [62, 1]
                                        ]
                                    },
                                    // increase intensity as zoom level increases
                                    'heatmap-intensity': {
                                        'stops': [
                                            [8, 0.5],
                                            [15, 3]
                                        ]
                                    },
                                    // use sequential color palette to use exponentially as the weight increases
                                    'heatmap-color': [
                                        'interpolate',
                                        ['linear'],
                                        ['heatmap-density'],
                                        0,
                                        "rgba(33,102,172,0)",
                                        0.1,
                                        "rgba(184,229,255,0.5)",
                                        0.3,
                                        "rgb(255,251,148)",
                                        0.5,
                                        "rgb(253,219,199)",
                                        0.7,
                                        "rgb(98,138,239)",
                                        1,
                                        "rgb(0,0,255)"
                                    ],

                                    // increase radius as zoom increases
                                    'heatmap-radius': {
                                        'stops': [
                                            [8, 1],
                                            [15, 20]
                                        ]
                                    },
                                    // decrease opacity to transition into the circle layer
                                    'heatmap-opacity': {
                                        'default': 1,
                                        'stops': [
                                            [8, 0.9],
                                            [16, 0.3]
                                        ]
                                    }
                                }
                            },
                        ],
                    })
                );

                map.Renderer.setLayoutProperty('accident-heat-rvp', 'visibility', 'none');
                map.Renderer.setLayoutProperty('accident_grids_rvp_dbscan_2022_2020', 'visibility', 'none');
                map.Renderer.setLayoutProperty('itic_dbscan', 'visibility', 'visibility');
                map.Renderer.setLayoutProperty('accident-heat', 'visibility', 'visibility');
                // map.Renderer.setLayoutProperty('accident_grids_itic_2022_2020', 'visibility', 'visible');

                // map.Renderer.on('click', 'accident_grids_itic_2022_2020', (e) => {
                //     const coordinates = e.features[0].geometry.coordinates.slice();
                //     const accidents = e.features[0].properties.accidents;
                //     const name = e.features[0].properties.name;
                //     const subdistrict = e.features[0].properties.subdistrict;

                //     while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                //         coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                //     }

                //     map.Overlays.add(new longdo.Popup({ lon: coordinates[0], lat: coordinates[1] },
                //         {
                //             title: name + ' ' + subdistrict,
                //             detail: 'จำนวนการเกิดอุบัติเหตุ ' + accidents + ' ครั้ง'
                //         }));
                // });

                map.Renderer.on('click', 'itic_dbscan', (e) => {

                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const accidents = e.features[0].properties.accidents;
                    const name = e.features[0].properties.road;
                    const subdistrict = e.features[0].properties.subdistrict;

                    while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                        coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                    }

                    map.Overlays.add(new longdo.Popup({ lon: coordinates[0], lat: coordinates[1] },
                        {
                            title: name + ' ' + subdistrict,
                            detail: 'จำนวนการเกิดอุบัติเหตุ ' + accidents + ' ครั้ง'
                        }));
                });

                map.Renderer.on('click', 'accident_grids_rvp_dbscan_2022_2020', (e) => {

                    const coordinates = e.features[0].geometry.coordinates.slice();
                    const accidents = e.features[0].properties.accidents;
                    const name = e.features[0].properties.road;
                    const subdistrict = e.features[0].properties.subdistrict;

                    while (Math.abs(e.lngLat.lng - coordinates[0]) > 180) {
                        coordinates[0] += e.lngLat.lng > coordinates[0] ? 360 : -360;
                    }

                    map.Overlays.add(new longdo.Popup({ lon: coordinates[0], lat: coordinates[1] },
                        {
                            title: name + ' ' + subdistrict,
                            detail: 'จำนวนการเกิดอุบัติเหตุ ' + accidents + ' ครั้ง'
                        }));
                });


                // map.Renderer.on('mouseenter', 'accident_grids_itic_2022_2020', () => {
                //     map.Renderer.getCanvas().style.cursor = 'pointer';
                // });

                // map.Renderer.on('mouseleave', 'accident_grids_itic_2022_2020', () => {
                //     map.Renderer.getCanvas().style.cursor = '';
                // });

                map.Renderer.on('mouseenter', 'itic_dbscan', () => {
                    map.Renderer.getCanvas().style.cursor = 'pointer';
                });

                map.Renderer.on('mouseleave', 'itic_dbscan', () => {
                    map.Renderer.getCanvas().style.cursor = '';
                });

                map.Renderer.on('mouseenter', 'accident_grids_rvp_dbscan_2022_2020', () => {
                    map.Renderer.getCanvas().style.cursor = 'pointer';
                });

                map.Renderer.on('mouseleave', 'accident_grids_rvp_dbscan_2022_2020', () => {
                    map.Renderer.getCanvas().style.cursor = '';
                });

                const selectElement = document.querySelector('.custom-select');

                selectElement.addEventListener('change', (event) => {
                    makeTable(event.target.value)
                    if (event.target.value === 'itic_road') {
                        makeTable('itic_road');
                        drawITIC();
                    } else if (event.target.value === 'itic_dbscan') {
                        makeTable('itic_dbscan');
                        drawITICDBScan();
                    } else if (event.target.value === 'rvp_dbscan') {
                        makeTable('rvp_dbscan');
                        drawRvpDBScan();
                    } else if (event.target.value === 'rvp_move_window') {
                        makeTable('rvp_move_window');
                    } else {
                        makeTable('dga_road');
                    }
                });

            });

            makeTable('itic_dbscan');
        }

        function gotoLocation(lat, lon) {
            map.location({ lat: lat, lon: lon })

            setTimeout(() => {
                map.zoom(16)
            }, 1000);
        }
        // dga_road
        function makeTable(arrayData) {
            let tempData = [];

            if (arrayData === 'itic_road') {
                tempData = itic_road;
                type_data = 'itic_road'

            } else if (arrayData === 'itic_dbscan') {
                tempData = itic_dbscan;
                type_data = 'itic_dbscan'

            } else if (arrayData === 'rvp_dbscan') {
                tempData = rvp_dbscan;
                type_data = 'rvp_dbscan'

            } else {
                tempData = dga_road;
            }

            const tableData = tempData.map(function (value) {
                return (
                    `<tr class="pointer" onclick="drawChild(` + value.gid + ',' + value.latitude + ',' + value.longitude + `)">
                        <td>${value.no}</td>
                        <td class="pointer">` + value.name + `</td>
                        <td class="count-accidents">${value.accidents}</td>
                    </tr>`
                );

                // return (
                //     `<tr>
                //         <td>${value.no}</td>
                //         <td class="pointer" onclick="gotoLocation(`+ value.latitude + ',' + value.longitude + `)">` + value.name + `</td>
                //         <td class="count-accidents">${value.accidents}</td>
                //         <td><button class="button" onclick="drawChild(`+ value.gid + ',' + value.latitude + ',' + value.longitude + `)">ดูเพิ่ม</button><td>
                //     </tr>`
                // );
            }).join('');

            const tabelBody = document.querySelector("#tableBody");
            const headerTable = "<tr><th>ลำดับ</th><th>บริเวณ</th><th>อุบัติเหตุ</th><th><th></tr>";
            // console.log(tableData)
            // console.log(headerTable.concat("", tableData));
            tableBody.innerHTML = headerTable.concat("", tableData);
        }

        function checkIsRoad(params) {
            if (params.name === '') { return params.subdistrict }
            else return params.name;
        }

        function drawChild(params, lat, lon) {
            console.log(type_data)
            let size_circle = 0.0021;
            if (type_data === 'itic_road') {
                size_circle = 0.0021
            } else {
                size_circle = 0.004
            }
            gotoLocation(lat, lon)
            map.Overlays.clear();
            var xmlhttp = new XMLHttpRequest();
            xmlhttp.onload = function () {
                const myObj = JSON.parse(this.responseText);
                map.Overlays.add(new longdo.Circle({
                    lon: lon,
                    lat: lat,
                }, size_circle, {
                    lineWidth: 1,
                    lineColor: 'rgba(200, 100, 100, 0.5)',
                    fillColor: 'rgba(200, 100, 100, 0.2)',
                    weight: 1
                }));

                myObj.forEach(element => {
                    map.Overlays.add(new longdo.Circle({
                        lon: element.lon,
                        lat: element.lat,
                    }, 0.00007, {
                        title: element.title,
                        detail: element.description + '</br>' + element.date_acc + '</br>' + element.contributor,
                        lineWidth: 1,
                        lineColor: 'rgba(0, 0, 200, 0.5)',
                        fillColor: 'rgba(0, 0, 200, 0.3)',
                        weight: 4
                    }));
                });
            }
            xmlhttp.open("GET", "./get_parent.php?gid=" + params + "&type=" + type_data, true);
            xmlhttp.send();
        }

        function drawITIC() {
            map.Overlays.clear();
            map.Renderer.setLayoutProperty('accident_grids_rvp_dbscan_2022_2020', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident_grids_itic_2022_2020', 'visibility', 'visible');
            map.Renderer.setLayoutProperty('itic_dbscan', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident-heat', 'visibility', 'visible');
            map.Renderer.setLayoutProperty('accident-heat-rvp', 'visibility', 'none');
        }

        function drawITICDBScan() {
            map.Overlays.clear();
            map.Renderer.setLayoutProperty('accident_grids_rvp_dbscan_2022_2020', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident_grids_itic_2022_2020', 'visibility', 'none');
            map.Renderer.setLayoutProperty('itic_dbscan', 'visibility', 'visible');
            map.Renderer.setLayoutProperty('accident-heat', 'visibility', 'visible');
            map.Renderer.setLayoutProperty('accident-heat-rvp', 'visibility', 'none');
        }
        function drawRvpDBScan() {
            map.Overlays.clear();
            map.Renderer.setLayoutProperty('accident_grids_itic_2022_2020', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident_grids_rvp_dbscan_2022_2020', 'visibility', 'visible');
            map.Renderer.setLayoutProperty('itic_dbscan', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident-heat', 'visibility', 'none');
            map.Renderer.setLayoutProperty('accident-heat-rvp', 'visibility', 'visible');
        }
    </script>
</head>
