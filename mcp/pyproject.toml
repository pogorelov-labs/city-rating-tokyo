[project]
name = "city-rating-mcp"
version = "0.1.0"
description = "MCP server exposing the Tokyo city-rating dataset"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.3.0",
    "pydantic>=2.8",
    "uvicorn[standard]>=0.30",
    "orjson>=3.10",
    "numpy>=1.26",
    "fastembed>=0.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
city-rating-mcp = "city_rating_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/city_rating_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
